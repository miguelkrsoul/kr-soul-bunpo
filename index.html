<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KR Soul - Bunpo Gratis</title><style>body{margin:0;background:#0a0a0f;color:#fff;font-family:system-ui;padding:20px}.card{background:#14141f;border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:18px;margin:16px 0}.accent{color:#ff2e93}button{background:#fff;color:#000;border:0;border-radius:999px;padding:8px 14px;font-weight:600}.mono{font-family:monospace;font-size:11px;opacity:.6}.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.hangul{background:#1e1e2f;border-radius:10px;padding:10px;text-align:center}</style></head><body><h2>KR Soul - <span class=accent>Bunpo Gratis</span></h2><p class=mono>Rolim → Seul 2028 · Seul <span id=s>--:--</span> | Rolim <span id=r>--:--</span></p><div class=card><h3>Hangul Rapido</h3><div class=grid id=h></div></div><div class=card><h3>Frase do Dia</h3><p><b>한국어 공부하고 있어요!</b><br>Estou estudando coreano!</p><p><b>영상 잘 보고 있어요 😊</b><br>Estou assistindo seus videos</p></div><div class=card><h3>Quiz 5 perguntas</h3><div id=q></div></div><footer class=mono>Feito por Miguel | KR Soul - Rolim de Moura RO<br><a href=https://miguelkrsoul.github.io style=color:#ff7ab8>Ver GitHub ↗</a></footer><script>function tick(){const n=new Date();const s=new Date(n.toLocaleString('en-US',{timeZone:'Asia/Seoul'}));document.getElementById('s').textContent=s.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});document.getElementById('r').textContent=n.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'})}setInterval(tick,1000);tick();const L=[['ㅎ','h'],['ㅏ','a'],['ㄴ','n'],['ㄱ','g'],['ㅕ','yeo'],['ㅇ','ng'],['ㅅ','s'],['ㅔ','e'],['ㅛ','yo'],['ㄹ','r']];document.getElementById('h').innerHTML=L.map(l=>`<div class=hangul><b>${l[0]}</b><br><span class=mono>${l[1]}</span></div>`).join('');const QS=[{q:'안녕하세요 =?',o:['Olá','Tchau','Obrigado'],a:0},{q:'10.000원 =?',o:['R$42','R$420'],a:0},{q:'Seul em coreano?',o:['서울','부산'],a:0},{q:'ㅎㅏ =?',o:['ha','na'],a:0},{q:'Rumo a Seul?',o:['2028','2026'],a:0}];let i=0,sc=0;function show(){const d=document.getElementById('q');if(i>=QS.length){d.innerHTML=`<h2>${sc}/5</h2><p>${sc==5?'대박!':sc>=3?'잘했어요!':'괜찮아요'}</p><button onclick="location.reload()">Refazer</button>`;return}const qu=QS[i];d.innerHTML=`<p><b>${i+1}. ${qu.q}</b></p>`+qu.o.map((o,j)=>`<button style="display:block;margin:6px 0;width:100%;text-align:left;background:#1e1e2f;color:#fff;border:1px solid #333;padding:10px;border-radius:10px" onclick="check(${j})">${o}</button>`).join('')}function check(j){if(j==QS[i].a)sc++;i++;show()}show();</script></body></html>
